name = "filedrop"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "src/frontend/dist"

[vars]
ENVIRONMENT = "production"
APP_NAME = "FileDrop"
MAX_FILE_SIZE_MB = "2048"
MAX_FILES_PER_TRANSFER = "50"
DEFAULT_EXPIRY_DAYS = "7"
GUEST_EXPIRY_DAYS = "3"
TURNSTILE_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "filedrop-db"
database_id = "filedrop-db-id-placeholder"

[[r2_buckets]]
binding = "R2"
bucket_name = "filedrop-transfers"

[[r2_buckets]]
binding = "R2_PREVIEW"
bucket_name = "filedrop-previews"

[triggers]
crons = ["0 */6 * * *", "0 2 * * *"]

[observability]
enabled = true

[assets]
directory = "src/frontend/dist"
not_found_handling = "single-page-application"

[build]
command = "npm run build"

# Development bindings (overridden via wrangler.jsonc or .dev.vars)
[dev]
port = 8787
